name: CI

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─── Type Check ───────────────────────────────────────────────────────────
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check reporter-core
        run: npx tsc --noEmit -p reporter-core/tsconfig.json

      - name: Type check test-runner
        run: npx tsc --noEmit -p test-runner/tsconfig.json

      - name: Type check cypress-plugin
        run: npx tsc --noEmit -p cypress-plugin/tsconfig.json

      - name: Type check cli
        run: npx tsc --noEmit -p cli/tsconfig.json

      - name: Type check selenium-plugin
        run: npx tsc --noEmit -p selenium-plugin/tsconfig.json

      - name: Type check webdriverio-plugin
        run: npx tsc --noEmit -p webdriverio-plugin/tsconfig.json

      - name: Type check ai-local
        run: npx tsc --noEmit -p ai-local/tsconfig.json

  # ─── Unit Tests (multi-OS: Healify es sensible a Windows) ──────────────────
  test:
    name: Unit Tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests (all workspaces)
        run: npm test

  # ─── gh-action (paquete privado, no es workspace: se testea aparte) ────────
  gh-action:
    name: gh-action tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install gh-action deps
        run: npm ci
        working-directory: gh-action

      - name: Run gh-action tests
        run: npm test
        working-directory: gh-action

  # ─── Coverage ──────────────────────────────────────────────────────────────
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Coverage (por paquete)
        run: npm run coverage

  # ─── Build ────────────────────────────────────────────────────────────────
  build:
    name: Build packages
    runs-on: ubuntu-latest
    needs: [typecheck, test]
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build all packages
        run: npm run build

  # ─── Security (SCA) ────────────────────────────────────────────────────────
  security-sca:
    name: Security SCA (npm audit)
    runs-on: ubuntu-latest
    needs: [typecheck]
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit production deps (fail on critical)
        run: npm audit --omit=dev --audit-level=critical
