name: CI

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─── Type Check ───────────────────────────────────────────────────────────
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Los tipos que un paquete ve del otro salen de `dist/*.d.ts`, y `dist/` está
      # gitignorado: sin buildear, tsc falla con TS2307 en todos los adapters.
      - name: Build workspaces (los tipos cruzados salen de los dist/)
        run: npm run build

      - name: Type check reporter-core
        run: npx tsc --noEmit -p reporter-core/tsconfig.json

      - name: Type check test-runner
        run: npx tsc --noEmit -p test-runner/tsconfig.json

      - name: Type check cypress-plugin
        run: npx tsc --noEmit -p cypress-plugin/tsconfig.json

      - name: Type check cli
        run: npx tsc --noEmit -p cli/tsconfig.json

      - name: Type check selenium-plugin
        run: npx tsc --noEmit -p selenium-plugin/tsconfig.json

      - name: Type check webdriverio-plugin
        run: npx tsc --noEmit -p webdriverio-plugin/tsconfig.json

      - name: Type check ai-local
        run: npx tsc --noEmit -p ai-local/tsconfig.json

  # ─── Lint ──────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # --max-warnings=0: "0 warnings" es una propiedad que el proyecto promete, no una
      # aspiración. Sin esto en CI se pierde en el primer PR que nadie mire de cerca.
      - name: ESLint (0 warnings)
        run: npx eslint . --max-warnings=0

  # ─── Unit Tests ────────────────────────────────────────────────────────────
  # Multi-OS porque Healify es sensible a Windows (paths, CRLF), y multi-Node porque 22 es
  # donde cambia el `require()` de ESM, que es justo lo que hace el loader de
  # healify.config.js.
  #
  # Node 18 NO está acá: Vitest 4 usa `styleText` de `node:util`, que existe recién desde
  # Node 20 — el runner de tests no arranca en 18, aunque el producto sí funcione. Esa
  # promesa (`engines: >=18`) se verifica en el job `smoke-node18`, que corre el binario
  # publicado de verdad sobre Node 18.
  test:
    name: Unit Tests (Node ${{ matrix.node }} · ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['20', '22']
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Los paquetes se importan entre sí como `@healify/reporter-core`, que resuelve al
      # `dist/` del workspace — y `dist/` está gitignorado. Sin buildear primero, vitest falla
      # con "Failed to resolve entry for package @healify/reporter-core" en todos los adapters.
      # Localmente no se notaba porque el dist ya estaba de un build anterior.
      - name: Build workspaces (los tests importan los dist/)
        run: npm run build

      - name: Run tests (all workspaces)
        run: npm test

  # ─── Smoke Node 18 ─────────────────────────────────────────────────────────
  # `engines: ">=18.0.0"` es una promesa al que instala el paquete, y hasta ahora no la
  # verificaba nada: la suite no puede correr en 18 (Vitest 4 necesita 20+), así que se
  # comprueba lo que de verdad importa — que el tarball publicado se instale y el motor
  # funcione sobre Node 18. Si esto falla, hay que subir `engines`, no ignorarlo.
  smoke-node18:
    name: Smoke Node 18 (verifica engines >=18)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Se buildea con 20 (el toolchain moderno) y se EJECUTA con 18: es exactamente lo que
      # pasa en la vida real — el usuario instala un tarball ya compilado.
      - name: Setup Node.js 20 (build)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build all packages
        run: npm run build

      - name: Pack @healify/cli
        run: npm pack --workspace=cli --pack-destination /tmp

      - name: Setup Node.js 18 (run)
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Instalar el tarball en un proyecto limpio
        run: |
          mkdir -p /tmp/smoke && cd /tmp/smoke
          npm init -y > /dev/null
          npm install /tmp/healify-cli-*.tgz

      - name: El binario arranca
        working-directory: /tmp/smoke
        run: |
          node --version
          npx healify --version
          npx healify --help > /dev/null

      # El motor de verdad, no solo el arranque: JSON por stdin, JSON por stdout.
      - name: El motor cura un selector sobre Node 18
        working-directory: /tmp/smoke
        run: |
          echo '{"selector":"#login-btn-a1b2c3"}' | npx healify heal | tee /tmp/heal.json
          node -e "const r=require('/tmp/heal.json'); if(!r.fixedSelector||typeof r.confidence!=='number'){console.error('respuesta inesperada',r);process.exit(1)}"

  # ─── gh-action (paquete privado, no es workspace: se testea aparte) ────────
  gh-action:
    name: gh-action tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install gh-action deps
        run: npm ci
        working-directory: gh-action

      - name: Run gh-action tests
        run: npm test
        working-directory: gh-action

  # ─── Coverage ──────────────────────────────────────────────────────────────
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Mismo motivo que en el job de tests: los adapters importan el dist/ de reporter-core.
      - name: Build workspaces
        run: npm run build

      - name: Coverage (por paquete)
        run: npm run coverage

  # ─── Build ────────────────────────────────────────────────────────────────
  build:
    name: Build packages
    runs-on: ubuntu-latest
    needs: [typecheck, lint, test]
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build all packages
        run: npm run build

  # ─── Security (SCA) ────────────────────────────────────────────────────────
  security-sca:
    name: Security SCA (npm audit)
    runs-on: ubuntu-latest
    needs: [typecheck]
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit production deps (fail on critical)
        run: npm audit --omit=dev --audit-level=critical
