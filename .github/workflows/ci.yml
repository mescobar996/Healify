name: CI

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─── Type Check ───────────────────────────────────────────────────────────
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Los tipos que un paquete ve del otro salen de `dist/*.d.ts`, y `dist/` está
      # gitignorado: sin buildear, tsc falla con TS2307 en todos los adapters.
      - name: Build workspaces (los tipos cruzados salen de los dist/)
        run: npm run build

      - name: Type check reporter-core
        run: npx tsc --noEmit -p reporter-core/tsconfig.json

      - name: Type check test-runner
        run: npx tsc --noEmit -p test-runner/tsconfig.json

      - name: Type check cypress-plugin
        run: npx tsc --noEmit -p cypress-plugin/tsconfig.json

      # El tsconfig de cli EXCLUIA src/__tests__, asi que sus tests nunca pasaron por tsc. Eso
      # dejo pasar helpers que construian LocalCaseResult sin campos requeridos y mocks
      # `vi.fn(() => [])` que inferian never[]: doce errores que solo aparecian en runtime, o
      # ni siquiera. Ahora el chequeo los cubre; el emit usa tsconfig.build.json.
      - name: Type check cli (incluye los tests)
        run: npx tsc --noEmit -p cli/tsconfig.json

      - name: Type check selenium-plugin
        run: npx tsc --noEmit -p selenium-plugin/tsconfig.json

      - name: Type check webdriverio-plugin
        run: npx tsc --noEmit -p webdriverio-plugin/tsconfig.json

      # Sin -p tsconfig.build.json a proposito: el tsconfig base incluye src/__tests__, asi que
      # aca los tests del paquete SI pasan por el chequeo de tipos.
      - name: Type check mcp
        run: npx tsc --noEmit -p mcp/tsconfig.json

      - name: Type check ai-local
        run: npx tsc --noEmit -p ai-local/tsconfig.json

  # ─── Lint ──────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # --max-warnings=0: "0 warnings" es una propiedad que el proyecto promete, no una
      # aspiración. Sin esto en CI se pierde en el primer PR que nadie mire de cerca.
      - name: ESLint (0 warnings)
        run: npx eslint . --max-warnings=0

      # El Marketplace rechaza descripciones de 125 caracteres o mas, y ese error aparece recien
      # al intentar publicar el release — no antes. Verificarlo aca lo convierte en un fallo de
      # CI en el commit que lo rompe, en vez de una sorpresa el dia que quieras publicar.
      - name: action.yml valido para el Marketplace
        run: |
          DESC=$(node -e "
            const fs=require('fs');
            const m=fs.readFileSync('action.yml','utf8').match(/^description:\s*'(.*)'\s*$/m);
            if(!m){console.error('no encontre description en action.yml');process.exit(1)}
            process.stdout.write(m[1]);
          ")
          LEN=${#DESC}
          echo "description: $LEN caracteres (limite del Marketplace: 125)"
          if [ "$LEN" -ge 125 ]; then
            echo "::error::La description de action.yml tiene $LEN caracteres. El Marketplace exige menos de 125."
            exit 1
          fi

      # Los 7 paquetes declaran "license": "MIT" pero el archivo vive en la raiz del REPO, y npm
      # solo lo mete en el tarball si esta en la raiz del PAQUETE. Lo resuelve un `prepack` que
      # copia el original (scripts/sync-license.mjs), y esa clase de arreglo es exactamente la
      # que deja de correr sin que nadie se entere. Un tarball publicado no se corrige: hay que
      # quemar una version nueva. Por eso se verifica el tarball de verdad, no el script.
      - name: LICENSE llega a los 8 tarballs
        run: |
          FALTAN=""
          for pkg in reporter-core test-runner cypress-plugin selenium-plugin webdriverio-plugin ai-local mcp cli; do
            if npm pack --workspace="$pkg" --dry-run 2>&1 | grep -q "LICENSE"; then
              echo "  ok  $pkg"
            else
              echo "  --  $pkg"
              FALTAN="$FALTAN $pkg"
            fi
          done
          if [ -n "$FALTAN" ]; then
            echo "::error::Estos paquetes se publicarian sin el texto de la licencia:$FALTAN"
            exit 1
          fi


  # ─── Unit Tests ────────────────────────────────────────────────────────────
  # Multi-OS porque Healify es sensible a Windows (paths, CRLF), y multi-Node porque 22 es
  # donde cambia el `require()` de ESM, que es justo lo que hace el loader de
  # healify.config.js.
  #
  # Node 18 NO está acá: Vitest 4 usa `styleText` de `node:util`, que existe recién desde
  # Node 20 — el runner de tests no arranca en 18, aunque el producto sí funcione. Esa
  # promesa (`engines: >=18`) se verifica en el job `smoke-node18`, que corre el binario
  # publicado de verdad sobre Node 18.
  test:
    name: Unit Tests (Node ${{ matrix.node }} · ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['20', '22']
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Los paquetes se importan entre sí como `@healify/reporter-core`, que resuelve al
      # `dist/` del workspace — y `dist/` está gitignorado. Sin buildear primero, vitest falla
      # con "Failed to resolve entry for package @healify/reporter-core" en todos los adapters.
      # Localmente no se notaba porque el dist ya estaba de un build anterior.
      - name: Build workspaces (los tests importan los dist/)
        run: npm run build

      - name: Run tests (all workspaces)
        run: npm test

  # ─── Ejemplos ──────────────────────────────────────────────────────────────
  # Los ejemplos viven DENTRO del repo (y no como repos sueltos) exactamente para esto: acá se
  # corre el ciclo completo contra un browser real, así no pueden pudrirse en silencio — que es
  # el destino de casi todos los `*-examples` que andan dando vueltas.
  #
  # Verifica las tres etapas del demo, en orden. Si cualquiera cambia de resultado, el ejemplo
  # dejó de contar la verdad y el job se pone en rojo.
  examples:
    name: Ejemplos (ciclo completo con browser real)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build workspaces
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # El ejemplo NO es un workspace (para no ensuciar el install de la raíz), así que se le
      # presta el node_modules de arriba. Eso además hace que resuelva `@healify/test-runner`
      # al build LOCAL y no al publicado en npm: acá se testea el código de este commit.
      - name: playwright-pom — el test falla con el selector roto
        working-directory: examples/playwright-pom
        run: |
          ln -s ../../node_modules node_modules
          if npx playwright test; then
            echo "::error::El ejemplo tiene que FALLAR antes del fix. Si pasa, el demo dejó de demostrar nada."
            exit 1
          fi

      - name: playwright-pom — healify cura el page object
        working-directory: examples/playwright-pom
        run: |
          node ../../cli/dist/index.js fix | tee fix.log
          grep -q "shop.page.ts" fix.log || {
            echo "::error::fix no tocó pages/shop.page.ts — el fallback a page objects se rompió."
            exit 1
          }
          grep -q "1 selector aplicado" fix.log || {
            echo "::error::fix no aplicó exactamente 1 selector."
            exit 1
          }

      - name: playwright-pom — ahora el test pasa
        working-directory: examples/playwright-pom
        run: npx playwright test

      # Los dos ejemplos de cura EN VIVO (Cypress y Selenium) no tienen etapa de "fix": el test
      # pasa o no pasa. Por eso no alcanza con `npm test` — si mañana alguien arregla el HTML del
      # demo y el selector roto vuelve a existir, el test seguiría verde mientras Healify no hace
      # nada. Se verifica además el reporte: tiene que decir `healed`, o el ejemplo miente.
      #
      # No es hipotético: los dos bugs que encontraron estos ejemplos (el retry que no cruzaba
      # shadow DOM, y el `instanceof` que hacía que el adapter de Selenium no curara nunca) eran
      # invisibles para la suite unitaria. Sin este job vuelven a serlo.
      - name: cypress-shadow-dom — cura en vivo dentro del shadow root
        working-directory: examples/cypress-shadow-dom
        run: |
          ln -s ../../node_modules node_modules
          node serve.mjs &
          # curl en loop y no `wait-on`: el ejemplo no lo tiene instalado y `npx wait-on` lo
          # bajaría de npm en cada corrida, agregando una dependencia de red al job.
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4322 > /dev/null && break; sleep 1; done
          npx cypress run

      - name: cypress-shadow-dom — el reporte confirma que curó (y no que el selector andaba)
        working-directory: examples/cypress-shadow-dom
        run: node ../../scripts/assert-healed.mjs healify-report.json '#pay-btn-a1b2c3'

      - name: selenium-live-heal — cura en vivo dentro del shadow root
        working-directory: examples/selenium-live-heal
        run: |
          ln -s ../../node_modules node_modules
          node serve.mjs &
          # curl en loop y no `wait-on`: el ejemplo no lo tiene instalado y `npx wait-on` lo
          # bajaría de npm en cada corrida, agregando una dependencia de red al job.
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4323 > /dev/null && break; sleep 1; done
          npm test 2>&1 | tee run.log
          grep -q "^OK:" run.log || {
            echo "::error::El test de Selenium no llegó al OK — el adapter no curó."
            exit 1
          }

      - name: selenium-live-heal — el reporte confirma que curó
        working-directory: examples/selenium-live-heal
        run: node ../../scripts/assert-healed.mjs healify-report.json '#save-btn-a1b2c3'

  # ─── Smoke Node 18 ─────────────────────────────────────────────────────────
  # `engines: ">=18.0.0"` es una promesa al que instala el paquete, y hasta ahora no la
  # verificaba nada: la suite no puede correr en 18 (Vitest 4 necesita 20+), así que se
  # comprueba lo que de verdad importa — que el tarball publicado se instale y el motor
  # funcione sobre Node 18. Si esto falla, hay que subir `engines`, no ignorarlo.
  smoke-node18:
    name: Smoke Node 18 (verifica engines >=18)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Se buildea con 20 (el toolchain moderno) y se EJECUTA con 18: es exactamente lo que
      # pasa en la vida real — el usuario instala un tarball ya compilado.
      - name: Setup Node.js 20 (build)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build all packages
        run: npm run build

      - name: Pack @healify/cli
        run: npm pack --workspace=cli --pack-destination /tmp

      - name: Setup Node.js 18 (run)
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Instalar el tarball en un proyecto limpio
        run: |
          mkdir -p /tmp/smoke && cd /tmp/smoke
          npm init -y > /dev/null
          npm install /tmp/healify-cli-*.tgz

      - name: El binario arranca
        working-directory: /tmp/smoke
        run: |
          node --version
          npx healify --version
          npx healify --help > /dev/null

      # El motor de verdad, no solo el arranque: JSON por stdin, JSON por stdout.
      - name: El motor cura un selector sobre Node 18
        working-directory: /tmp/smoke
        run: |
          echo '{"selector":"#login-btn-a1b2c3"}' | npx healify heal | tee /tmp/heal.json
          node -e "const r=require('/tmp/heal.json'); if(!r.fixedSelector||typeof r.confidence!=='number'){console.error('respuesta inesperada',r);process.exit(1)}"

  # ─── gh-action (paquete privado, no es workspace: se testea aparte) ────────
  gh-action:
    name: gh-action tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install gh-action deps
        run: npm ci
        working-directory: gh-action

      - name: Run gh-action tests
        run: npm test
        working-directory: gh-action

  # ─── La Action, ejecutada de verdad ────────────────────────────────────────
  # Los tests de arriba prueban run.js en aislamiento; nada probaba que el action.yml en sí sea
  # válido y arranque. Cuando pasó de `node20` a composite eso dejó de ser un detalle: un YAML
  # mal formado, un input mal mapeado o un `uses:` inexistente solo aparecen al invocarla. Se
  # invoca la copia local (`./`), no una versión publicada.
  gh-action-run:
    name: gh-action se ejecuta (composite)
    # El job solo tiene sentido en pull_request: en push no hay PR para analizar y la Action
    # (run.js) despacha a runAutoPrFlow, que exige un test-output.log que no existe — el CLI
    # sale sin escribir history.jsonl y el assert de abajo falla. Ese fallo es pre-existente
    # y ajeno a esta PR; restringirlo a PR evita rojo en cada push a main.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Sin esto `npx @healify/cli` bajaría la versión PUBLICADA de npm en vez de la del PR,
      # y el job estaría probando código viejo. Con el workspace instalado y buildeado, npx
      # resuelve al binario local.
      #
      # El segundo install no es redundante: `cli/dist` está gitignoreado, así que en un runner
      # limpio `npm ci` corre cuando `cli/dist/index.js` todavía no existe y npm no deja el bin
      # link de `healify`. Resultado: `npx @healify/cli` moría con `sh: healify: not found`.
      # Reinstalar después del build rehace los links con el destino ya presente.
      - name: Install and build
        run: |
          npm ci
          npm run build
          npm install --ignore-scripts --no-audit --no-fund

      # Si el link no está, el fallo tiene que decir ESO y no disfrazarse de "la Action no
      # escribió el historial" tres pasos más abajo.
      - name: Assert the local CLI is reachable
        run: |
          if [ ! -e node_modules/.bin/healify ]; then
            echo "::error::node_modules/.bin/healify no existe — npx no va a poder resolver el CLI local."
            ls -la node_modules/.bin | head -20
            exit 1
          fi
          npx @healify/cli --version

      # `fix` necesita un reporte para leer. Uno mínimo alcanza: lo que se prueba acá es que
      # la Action arranque y llegue a ejecutar el CLI de punta a punta, no la heurística.
      - name: Seed a report
        run: |
          cat > healify-report.json <<'JSON'
          {
            "project": "healify-ci",
            "framework": "Playwright",
            "generatedAt": "2026-08-06T00:00:00.000Z",
            "cases": [
              {
                "testName": "smoke de la action",
                "testFile": "e2e/smoke.spec.ts",
                "selector": "#add-to-cart",
                "errorMessage": "Waiting for selector '#add-to-cart' failed",
                "status": "healed",
                "fixedSelector": "[data-testid='add-to-cart']",
                "confidence": 0.95,
                "explanation": "",
                "selectorType": "TESTID",
                "cause": "selector",
                "defectId": "HLF-CI0001",
                "severity": "major"
              }
            ]
          }
          JSON

      - name: Run the local action
        uses: ./
        with:
          project-path: '.'

      # La Action reporta los fallos del CLI en el comentario de la PR, no con un exit code
      # (a propósito: un job rojo sin explicación es peor). Así que el job tiene que mirar el
      # efecto observable. Si el CLI no corrió, --record-history no escribió nada.
      #
      # Este chequeo es la red contra el bug que encontró esta misma PR: la Action comentaba
      # "All Clear ✅" cuando el CLI ni siquiera arrancaba. Un verde no puede volver a
      # significar "no se ejecutó nada".
      - name: Assert Healify actually ran
        run: |
          if [ ! -f .healify/history.jsonl ]; then
            echo "::error::La Action terminó sin escribir .healify/history.jsonl — el CLI no llegó a correr."
            exit 1
          fi
          echo "history.jsonl escrito:"
          cat .healify/history.jsonl
          grep -q '"cause"' .healify/history.jsonl || {
            echo "::error::El historial no tiene el campo cause."
            exit 1
          }

  # ─── CLI de punta a punta ──────────────────────────────────────────────────
  # Invoca el binario del CLI como lo haría un usuario, sobre reportes de verdad en un tmpdir.
  # No corría en ningún lado: su config decía `**/*.test.ts`, que desde la raíz del repo barría
  # los 61 archivos de todos los workspaces y terminaba en dos fallos que no eran bugs. Nadie la
  # corría, así que nadie lo notó. Acotada y en CI, para que no se vuelva a pudrir.
  integration:
    name: CLI de punta a punta
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # El test ejecuta cli/dist/index.js: sin build no hay binario que invocar.
      - name: Build workspaces
        run: npm run build

      # Un test ejercita `fix --pr`, que hace `git checkout -b`. Sin identidad configurada,
      # git falla con "Please tell me who you are" y el caso deja de probar lo que quería.
      - name: Configurar identidad de git
        run: |
          git config user.email "ci@healify.test"
          git config user.name "Healify CI"

      # No tiene package.json propio: `npx vitest` resuelve el de la raiz subiendo por el arbol.
      - name: Run
        run: npx vitest run
        working-directory: integration-test

  # ─── Extensión de VS Code ──────────────────────────────────────────────────
  # Dos niveles, por el mismo motivo que existen los ejemplos: lo que decide QUÉ marcar vive
  # en src/core/ y se testea con vitest, pero que eso llegue a la pantalla depende de la API
  # de vscode. Mockearla probaría el mock, así que la segunda tanda levanta un VS Code de
  # verdad con xvfb y verifica los diagnostics y el Quick Fix ahí adentro.
  vscode-extension:
    name: Extensión de VS Code
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: npm ci
        working-directory: vscode-extension

      - name: Type check
        run: npm run typecheck
        working-directory: vscode-extension

      - name: Unit tests (core, sin editor)
        run: npm test
        working-directory: vscode-extension

      # VS Code es una app de Electron: sin display no arranca. xvfb-run le da uno virtual.
      - name: Tests de integración (VS Code real)
        run: xvfb-run -a npm run test:integration
        working-directory: vscode-extension

      - name: Empaquetar .vsix
        run: npx --yes @vscode/vsce package --no-dependencies
        working-directory: vscode-extension

      - name: Guardar el .vsix como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: healify-vscode
          path: vscode-extension/*.vsix

  # ─── Coverage ──────────────────────────────────────────────────────────────
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Mismo motivo que en el job de tests: los adapters importan el dist/ de reporter-core.
      - name: Build workspaces
        run: npm run build

      - name: Coverage (por paquete)
        run: npm run coverage

  # ─── Build ────────────────────────────────────────────────────────────────
  build:
    name: Build packages
    runs-on: ubuntu-latest
    needs: [typecheck, lint, test]
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build all packages
        run: npm run build

  # ─── Security (SCA) ────────────────────────────────────────────────────────
  security-sca:
    name: Security SCA (npm audit)
    runs-on: ubuntu-latest
    needs: [typecheck]
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit production deps (fail on critical)
        run: npm audit --omit=dev --audit-level=critical
