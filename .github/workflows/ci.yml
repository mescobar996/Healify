name: CI

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─── Lint + Type Check ────────────────────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

  # ─── Unit Tests ───────────────────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run app unit tests
        run: npm test

      - name: Run reporter-core tests
        run: npm test --workspace=reporter-core

      - name: Run test-runner tests
        run: npx vitest run
        working-directory: test-runner

  # ─── Build ────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    timeout-minutes: 15

    env:
      SKIP_ENV_VALIDATION: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build reporter-core
        run: npm run build --workspace=reporter-core

      - name: Build test-runner
        run: npm run build --workspace=test-runner

      - name: Build cypress-plugin
        run: npm run build --workspace=cypress-plugin

      - name: Build Next.js app
        run: npx next build

  # ─── Security (SCA) ────────────────────────────────────────────────────────
  security-sca:
    name: Security SCA (npm audit)
    runs-on: ubuntu-latest
    needs: [lint]
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit production deps (fail on critical)
        run: npm audit --omit=dev --audit-level=critical

  # ─── E2E API Tests (landing + /api/v1/report, no auth needed) ────────────
  e2e-api:
    name: E2E API Tests
    runs-on: ubuntu-latest
    needs: [build, security-sca]
    timeout-minutes: 15

    env:
      SKIP_ENV_VALIDATION: 'true'
      HEALIFY_API_KEY: 'ci-test-key-not-real'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright (Chromium only)
        run: npx playwright install chromium --with-deps

      - name: Run API E2E tests
        run: npx playwright test --project=api --reporter=github
        env:
          CI: 'true'
          PLAYWRIGHT_BASE_URL: 'http://localhost:3000'

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-api-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
