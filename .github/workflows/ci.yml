name: CI

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─── Type Check ───────────────────────────────────────────────────────────
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Los tipos que un paquete ve del otro salen de `dist/*.d.ts`, y `dist/` está
      # gitignorado: sin buildear, tsc falla con TS2307 en todos los adapters.
      - name: Build workspaces (los tipos cruzados salen de los dist/)
        run: npm run build

      - name: Type check reporter-core
        run: npx tsc --noEmit -p reporter-core/tsconfig.json

      - name: Type check test-runner
        run: npx tsc --noEmit -p test-runner/tsconfig.json

      - name: Type check cypress-plugin
        run: npx tsc --noEmit -p cypress-plugin/tsconfig.json

      - name: Type check cli
        run: npx tsc --noEmit -p cli/tsconfig.json

      - name: Type check selenium-plugin
        run: npx tsc --noEmit -p selenium-plugin/tsconfig.json

      - name: Type check webdriverio-plugin
        run: npx tsc --noEmit -p webdriverio-plugin/tsconfig.json

      - name: Type check ai-local
        run: npx tsc --noEmit -p ai-local/tsconfig.json

  # ─── Lint ──────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # --max-warnings=0: "0 warnings" es una propiedad que el proyecto promete, no una
      # aspiración. Sin esto en CI se pierde en el primer PR que nadie mire de cerca.
      - name: ESLint (0 warnings)
        run: npx eslint . --max-warnings=0

      # El Marketplace rechaza descripciones de 125 caracteres o mas, y ese error aparece recien
      # al intentar publicar el release — no antes. Verificarlo aca lo convierte en un fallo de
      # CI en el commit que lo rompe, en vez de una sorpresa el dia que quieras publicar.
      - name: action.yml valido para el Marketplace
        run: |
          DESC=$(node -e "
            const fs=require('fs');
            const m=fs.readFileSync('action.yml','utf8').match(/^description:\s*'(.*)'\s*$/m);
            if(!m){console.error('no encontre description en action.yml');process.exit(1)}
            process.stdout.write(m[1]);
          ")
          LEN=${#DESC}
          echo "description: $LEN caracteres (limite del Marketplace: 125)"
          if [ "$LEN" -ge 125 ]; then
            echo "::error::La description de action.yml tiene $LEN caracteres. El Marketplace exige menos de 125."
            exit 1
          fi


  # ─── Unit Tests ────────────────────────────────────────────────────────────
  # Multi-OS porque Healify es sensible a Windows (paths, CRLF), y multi-Node porque 22 es
  # donde cambia el `require()` de ESM, que es justo lo que hace el loader de
  # healify.config.js.
  #
  # Node 18 NO está acá: Vitest 4 usa `styleText` de `node:util`, que existe recién desde
  # Node 20 — el runner de tests no arranca en 18, aunque el producto sí funcione. Esa
  # promesa (`engines: >=18`) se verifica en el job `smoke-node18`, que corre el binario
  # publicado de verdad sobre Node 18.
  test:
    name: Unit Tests (Node ${{ matrix.node }} · ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['20', '22']
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Los paquetes se importan entre sí como `@healify/reporter-core`, que resuelve al
      # `dist/` del workspace — y `dist/` está gitignorado. Sin buildear primero, vitest falla
      # con "Failed to resolve entry for package @healify/reporter-core" en todos los adapters.
      # Localmente no se notaba porque el dist ya estaba de un build anterior.
      - name: Build workspaces (los tests importan los dist/)
        run: npm run build

      - name: Run tests (all workspaces)
        run: npm test

  # ─── Ejemplos ──────────────────────────────────────────────────────────────
  # Los ejemplos viven DENTRO del repo (y no como repos sueltos) exactamente para esto: acá se
  # corre el ciclo completo contra un browser real, así no pueden pudrirse en silencio — que es
  # el destino de casi todos los `*-examples` que andan dando vueltas.
  #
  # Verifica las tres etapas del demo, en orden. Si cualquiera cambia de resultado, el ejemplo
  # dejó de contar la verdad y el job se pone en rojo.
  examples:
    name: Ejemplos (ciclo completo con browser real)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build workspaces
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # El ejemplo NO es un workspace (para no ensuciar el install de la raíz), así que se le
      # presta el node_modules de arriba. Eso además hace que resuelva `@healify/test-runner`
      # al build LOCAL y no al publicado en npm: acá se testea el código de este commit.
      - name: playwright-pom — el test falla con el selector roto
        working-directory: examples/playwright-pom
        run: |
          ln -s ../../node_modules node_modules
          if npx playwright test; then
            echo "::error::El ejemplo tiene que FALLAR antes del fix. Si pasa, el demo dejó de demostrar nada."
            exit 1
          fi

      - name: playwright-pom — healify cura el page object
        working-directory: examples/playwright-pom
        run: |
          node ../../cli/dist/index.js fix | tee fix.log
          grep -q "shop.page.ts" fix.log || {
            echo "::error::fix no tocó pages/shop.page.ts — el fallback a page objects se rompió."
            exit 1
          }
          grep -q "1 selector aplicado" fix.log || {
            echo "::error::fix no aplicó exactamente 1 selector."
            exit 1
          }

      - name: playwright-pom — ahora el test pasa
        working-directory: examples/playwright-pom
        run: npx playwright test

      # Los dos ejemplos de cura EN VIVO (Cypress y Selenium) no tienen etapa de "fix": el test
      # pasa o no pasa. Por eso no alcanza con `npm test` — si mañana alguien arregla el HTML del
      # demo y el selector roto vuelve a existir, el test seguiría verde mientras Healify no hace
      # nada. Se verifica además el reporte: tiene que decir `healed`, o el ejemplo miente.
      #
      # No es hipotético: los dos bugs que encontraron estos ejemplos (el retry que no cruzaba
      # shadow DOM, y el `instanceof` que hacía que el adapter de Selenium no curara nunca) eran
      # invisibles para la suite unitaria. Sin este job vuelven a serlo.
      - name: cypress-shadow-dom — cura en vivo dentro del shadow root
        working-directory: examples/cypress-shadow-dom
        run: |
          ln -s ../../node_modules node_modules
          node serve.mjs &
          # curl en loop y no `wait-on`: el ejemplo no lo tiene instalado y `npx wait-on` lo
          # bajaría de npm en cada corrida, agregando una dependencia de red al job.
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4322 > /dev/null && break; sleep 1; done
          npx cypress run

      - name: cypress-shadow-dom — el reporte confirma que curó (y no que el selector andaba)
        working-directory: examples/cypress-shadow-dom
        run: node ../../scripts/assert-healed.mjs healify-report.json '#pay-btn-a1b2c3'

      - name: selenium-live-heal — cura en vivo dentro del shadow root
        working-directory: examples/selenium-live-heal
        run: |
          ln -s ../../node_modules node_modules
          node serve.mjs &
          # curl en loop y no `wait-on`: el ejemplo no lo tiene instalado y `npx wait-on` lo
          # bajaría de npm en cada corrida, agregando una dependencia de red al job.
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4323 > /dev/null && break; sleep 1; done
          npm test 2>&1 | tee run.log
          grep -q "^OK:" run.log || {
            echo "::error::El test de Selenium no llegó al OK — el adapter no curó."
            exit 1
          }

      - name: selenium-live-heal — el reporte confirma que curó
        working-directory: examples/selenium-live-heal
        run: node ../../scripts/assert-healed.mjs healify-report.json '#save-btn-a1b2c3'

  # ─── Smoke Node 18 ─────────────────────────────────────────────────────────
  # `engines: ">=18.0.0"` es una promesa al que instala el paquete, y hasta ahora no la
  # verificaba nada: la suite no puede correr en 18 (Vitest 4 necesita 20+), así que se
  # comprueba lo que de verdad importa — que el tarball publicado se instale y el motor
  # funcione sobre Node 18. Si esto falla, hay que subir `engines`, no ignorarlo.
  smoke-node18:
    name: Smoke Node 18 (verifica engines >=18)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Se buildea con 20 (el toolchain moderno) y se EJECUTA con 18: es exactamente lo que
      # pasa en la vida real — el usuario instala un tarball ya compilado.
      - name: Setup Node.js 20 (build)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build all packages
        run: npm run build

      - name: Pack @healify/cli
        run: npm pack --workspace=cli --pack-destination /tmp

      - name: Setup Node.js 18 (run)
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Instalar el tarball en un proyecto limpio
        run: |
          mkdir -p /tmp/smoke && cd /tmp/smoke
          npm init -y > /dev/null
          npm install /tmp/healify-cli-*.tgz

      - name: El binario arranca
        working-directory: /tmp/smoke
        run: |
          node --version
          npx healify --version
          npx healify --help > /dev/null

      # El motor de verdad, no solo el arranque: JSON por stdin, JSON por stdout.
      - name: El motor cura un selector sobre Node 18
        working-directory: /tmp/smoke
        run: |
          echo '{"selector":"#login-btn-a1b2c3"}' | npx healify heal | tee /tmp/heal.json
          node -e "const r=require('/tmp/heal.json'); if(!r.fixedSelector||typeof r.confidence!=='number'){console.error('respuesta inesperada',r);process.exit(1)}"

  # ─── gh-action (paquete privado, no es workspace: se testea aparte) ────────
  gh-action:
    name: gh-action tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install gh-action deps
        run: npm ci
        working-directory: gh-action

      - name: Run gh-action tests
        run: npm test
        working-directory: gh-action

  # ─── Coverage ──────────────────────────────────────────────────────────────
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Mismo motivo que en el job de tests: los adapters importan el dist/ de reporter-core.
      - name: Build workspaces
        run: npm run build

      - name: Coverage (por paquete)
        run: npm run coverage

  # ─── Build ────────────────────────────────────────────────────────────────
  build:
    name: Build packages
    runs-on: ubuntu-latest
    needs: [typecheck, lint, test]
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build all packages
        run: npm run build

  # ─── Security (SCA) ────────────────────────────────────────────────────────
  security-sca:
    name: Security SCA (npm audit)
    runs-on: ubuntu-latest
    needs: [typecheck]
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit production deps (fail on critical)
        run: npm audit --omit=dev --audit-level=critical
