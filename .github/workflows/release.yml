# Publicación de los 7 paquetes a npm con Trusted Publishing (OIDC) + provenance.
#
# NO hay token. npm confía en este workflow porque cada paquete tiene configurado, del lado de
# npmjs.com, un "trusted publisher" que apunta exactamente a este repo y a este archivo. El
# runner pide un id-token a GitHub, npm lo valida contra esa configuración y autoriza la
# escritura. Es lo que reemplaza al NPM_TOKEN: no hay secreto que filtrar, que vencer, ni que
# rotar, y nadie puede publicar en nombre de @healify desde otro repo u otro workflow.
#
# Provenance (https://docs.npmjs.com/generating-provenance-statements) se genera solo en este
# modo: npm firma y publica de forma verificable desde qué commit y qué workflow salió cada
# tarball.
#
# Requisitos que impone y que están cubiertos:
#   - `id-token: write` (OIDC): sin esto no hay nada que npm pueda validar.
#   - **npm >= 11.5.1**: es la versión que introdujo trusted publishing. Node 20 trae npm 10.x,
#     así que se actualiza a mano abajo. Sin esto npm ni intenta el intercambio OIDC y falla
#     pidiendo autenticación.
#   - `repository.url` en cada package.json apuntando a ESTE repo.
#   - El trusted publisher configurado en npmjs.com para LOS 7 paquetes, con workflow
#     `release.yml`. Si cambia el nombre de este archivo, hay que actualizarlo allá.
#
# Se dispara con un tag `v*`. El publish es irreversible: un `npm unpublish` solo se puede
# hacer dentro de las 72 h y quema la versión para siempre.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Correr npm publish --dry-run (no publica nada)'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node 22, no 20: `npm install -g npm@latest` de abajo instala npm 12.x, que a su vez
      # exige Node >=22 — con Node 20 ese install fallaba con EBADENGINE antes de llegar
      # siquiera a chequear la versión de npm. 22 ya está validado en la matriz de CI (job
      # "Unit Tests · Node 22"), así que no es una combinación sin probar.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing existe recién desde npm 11.5.1, y el npm que trae Node por defecto
      # suele ir atrás de eso. Sin esto npm ni intenta el intercambio OIDC: pide autenticación
      # y falla con un error que no menciona nada de esto. Se verifica explícitamente para que,
      # si algún día vuelve a fallar (por ejemplo si npm@latest exige un Node más nuevo que el
      # de este job), el log diga por qué en vez de un EBADENGINE críptico.
      - name: Actualizar npm (trusted publishing necesita >= 11.5.1)
        run: |
          npm install -g npm@latest
          NPM_V=$(npm --version)
          echo "npm $NPM_V · node $(node --version)"
          printf '11.5.1\n%s\n' "$NPM_V" | sort -V -C || {
            echo "::error::npm $NPM_V no soporta trusted publishing (hace falta >= 11.5.1)"
            exit 1
          }

      - name: Install dependencies
        run: npm ci

      # Build ANTES que test: los adapters se importan entre sí como `@healify/reporter-core`,
      # que resuelve al `dist/` del workspace (gitignorado). Invertido, vitest no resuelve nada.
      - name: Build all packages
        run: npm run build

      # La suite completa antes de publicar. Un paquete roto en npm no se puede "arreglar":
      # hay que quemar una versión nueva.
      - name: Run tests
        run: npm test

      - name: Publish
        # El orden importa: reporter-core primero porque todos lo bundlean.
        run: |
          DRY=""
          if [ "${{ inputs.dry-run }}" = "true" ]; then DRY="--dry-run"; fi
          for pkg in reporter-core test-runner cypress-plugin selenium-plugin webdriverio-plugin ai-local cli; do
            echo "::group::publish $pkg"
            npm publish --workspace="$pkg" --provenance --access public $DRY
            echo "::endgroup::"
          done
        # Sin `env: NODE_AUTH_TOKEN` a propósito: la autorización sale del id-token de OIDC que
        # npm negocia solo. Si alguna vez vuelve a aparecer un token acá, se pierde la garantía
        # de que solo este workflow puede publicar.
