# Publicación de los 8 paquetes a npm con Trusted Publishing (OIDC) + provenance.
#
# NO hay token. npm confía en este workflow porque cada paquete tiene configurado, del lado de
# npmjs.com, un "trusted publisher" que apunta exactamente a este repo y a este archivo. El
# runner pide un id-token a GitHub, npm lo valida contra esa configuración y autoriza la
# escritura. Es lo que reemplaza al NPM_TOKEN: no hay secreto que filtrar, que vencer, ni que
# rotar, y nadie puede publicar en nombre de @healify desde otro repo u otro workflow.
#
# Provenance (https://docs.npmjs.com/generating-provenance-statements) se genera solo en este
# modo: npm firma y publica de forma verificable desde qué commit y qué workflow salió cada
# tarball.
#
# Requisitos que impone y que están cubiertos:
#   - `id-token: write` (OIDC): sin esto no hay nada que npm pueda validar.
#   - **npm >= 11.5.1**: es la versión que introdujo trusted publishing. Node 20 trae npm 10.x,
#     así que se actualiza a mano abajo. Sin esto npm ni intenta el intercambio OIDC y falla
#     pidiendo autenticación.
#   - `repository.url` en cada package.json apuntando a ESTE repo.
#   - El trusted publisher configurado en npmjs.com para LOS 8 paquetes, con workflow
#     `release.yml`. Si cambia el nombre de este archivo, hay que actualizarlo allá.
#
# Se dispara con un tag de version. El publish es irreversible: un `npm unpublish` solo se puede
# hacer dentro de las 72 h y quema la versión para siempre.
name: Release

# `v*.*.*` y no `v*`: el alias movil `v2` existe para los que consumen la GitHub Action
# (`uses: mescobar996/Healify@v2`), no para publicar. Con el patron viejo, mover el alias
# disparaba un SEGUNDO release en paralelo con el del tag de version, y el guard de
# idempotencia no alcanzaba a verlo: `npm view` corria antes de que la otra corrida publicara,
# pasaba el chequeo, e intentaba publicar igual. Eso es lo que paso en 2.4.0 — E403 "cannot
# publish over the previously published versions" en selenium-plugin, con los siete paquetes
# ya publicados correctamente por la otra corrida. El artefacto queda bien y el release queda
# en rojo, que es la peor combinacion: entrena a ignorar los rojos.
#
# `mcp-v*`: @healify/mcp tiene su propia linea de versiones (0.1.0), como la extension de VS
# Code, porque su ciclo no es el de los paquetes 2.x. Arrastrar los siete a un 2.4.1 solo para
# publicarlo seria ruido. El guard de idempotencia hace que un tag `mcp-v*` saltee los siete ya
# publicados y suba unicamente el que cambio.
on:
  push:
    tags:
      - 'v*.*.*'
      - 'mcp-v*'
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Correr npm publish --dry-run (no publica nada)'
        type: boolean
        default: true

# Cinturon y tiradores: aunque el filtro de arriba ya evita el caso conocido, dos releases no
# pueden solaparse nunca. `cancel-in-progress: false` a proposito — cortar un publish por la
# mitad deja algunos paquetes publicados y otros no, que es mucho peor que esperar.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node 22, no 20: `npm install -g npm@latest` de abajo instala npm 12.x, que a su vez
      # exige Node >=22 — con Node 20 ese install fallaba con EBADENGINE antes de llegar
      # siquiera a chequear la versión de npm. 22 ya está validado en la matriz de CI (job
      # "Unit Tests · Node 22"), así que no es una combinación sin probar.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing existe recién desde npm 11.5.1, y el npm que trae Node por defecto
      # suele ir atrás de eso. Sin esto npm ni intenta el intercambio OIDC: pide autenticación
      # y falla con un error que no menciona nada de esto. Se verifica explícitamente para que,
      # si algún día vuelve a fallar (por ejemplo si npm@latest exige un Node más nuevo que el
      # de este job), el log diga por qué en vez de un EBADENGINE críptico.
      - name: Actualizar npm (trusted publishing necesita >= 11.5.1)
        run: |
          npm install -g npm@latest
          NPM_V=$(npm --version)
          echo "npm $NPM_V · node $(node --version)"
          printf '11.5.1\n%s\n' "$NPM_V" | sort -V -C || {
            echo "::error::npm $NPM_V no soporta trusted publishing (hace falta >= 11.5.1)"
            exit 1
          }

      - name: Install dependencies
        run: npm ci

      # Build ANTES que test: los adapters se importan entre sí como `@healify/reporter-core`,
      # que resuelve al `dist/` del workspace (gitignorado). Invertido, vitest no resuelve nada.
      - name: Build all packages
        run: npm run build

      # La suite completa antes de publicar. Un paquete roto en npm no se puede "arreglar":
      # hay que quemar una versión nueva.
      - name: Run tests
        run: npm test

      - name: Publish
        # El orden importa: reporter-core primero porque todos lo bundlean.
        #
        # `mcp` entro a esta lista el 2026-08-06, despues de romper a mano el huevo-y-gallina de
        # trusted publishing: npm exige que el paquete YA EXISTA para poder configurarle un
        # trusted publisher, y OIDC no puede hacer la primera publicacion (npm/cli#8544). Se
        # publico un placeholder 0.0.0 deprecado, se configuro el trust con `npm trust github`,
        # y desde aca el camino es el mismo que el de los otros siete.
        run: |
          DRY=""
          if [ "${{ inputs.dry-run }}" = "true" ]; then DRY="--dry-run"; fi
          for pkg in reporter-core test-runner cypress-plugin selenium-plugin webdriverio-plugin ai-local mcp cli; do
            echo "::group::publish $pkg"
            NAME=$(node -p "require('./$pkg/package.json').name")
            VER=$(node -p "require('./$pkg/package.json').version")
            # Idempotente: si esa version ya esta en npm, se saltea en vez de fallar. Sin esto,
            # re-apuntar un tag (por ejemplo para corregir metadata del action.yml) re-dispara
            # este workflow y muere con E403 "cannot publish over previously published version",
            # dejando una corrida en rojo que no significa nada.
            if npm view "$NAME@$VER" version > /dev/null 2>&1; then
              echo "$NAME@$VER ya esta publicado — se saltea"
            else
              npm publish --workspace="$pkg" --provenance --access public $DRY
            fi
            echo "::endgroup::"
          done
        # Sin `env: NODE_AUTH_TOKEN` a propósito: la autorización sale del id-token de OIDC que
        # npm negocia solo. Si alguna vez vuelve a aparecer un token acá, se pierde la garantía
        # de que solo este workflow puede publicar.
