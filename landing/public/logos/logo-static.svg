<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none" role="img" aria-label="Healify logo">
  <defs>
    <!-- Gradiente principal verde -> cian -> azul -->
    <linearGradient id="healifyGrad" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="55%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <!-- Gradiente para glow radial sutil -->
    <radialGradient id="glowGrad" cx="32" cy="36" r="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <!-- Sombra / glow -->
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#06b6d4" flood-opacity="0.35"/>
      <feDropShadow dx="0" dy="2" stdDeviation="8" flood-color="#10b981" flood-opacity="0.25"/>
    </filter>
    <!-- Borde glass -->
    <linearGradient id="glassStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="white" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="white" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <!-- Glow detrás -->
  <circle cx="32" cy="36" r="26" fill="url(#glowGrad)"/>

  <!-- Escudo base con gradiente + glassmorphism -->
  <g filter="url(#softGlow)">
    <path
      d="M32 5.5 
         C32 5.5 54 14.2 54 14.2
         L54 31.5
         C54 44.2 38.5 55.8 32 59.5
         C25.5 55.8 10 44.2 10 31.5
         L10 14.2
         C10 14.2 32 5.5 32 5.5 Z"
      fill="url(#healifyGrad)"
      fill-opacity="0.95"
      stroke="url(#glassStroke)"
      stroke-width="1.2"
    />
    <!-- Highlight glass superior -->
    <path
      d="M32 7.2
         C32 7.2 51.5 15 51.5 15
         L51.5 20
         C51.5 20 32 12.5 32 12.5
         C32 12.5 12.5 20 12.5 20
         L12.5 15
         C12.5 15 32 7.2 32 7.2 Z"
      fill="white"
      fill-opacity="0.18"
    />
  </g>

  <!-- H estilizada - negativa en blanco con esquinas redondeadas -->
  <g>
    <!-- Sombra interna sutil de la H -->
    <path
      d="M22 21.5
         C22 20.12 23.12 19 24.5 19
         H27.5
         C28.88 19 30 20.12 30 21.5
         V28.5
         H34
         V21.5
         C34 20.12 35.12 19 36.5 19
         H39.5
         C40.88 19 42 20.12 42 21.5
         V42.5
         C42 43.88 40.88 45 39.5 45
         H36.5
         C35.12 45 34 43.88 34 42.5
         V35.5
         H30
         V42.5
         C30 43.88 28.88 45 27.5 45
         H24.5
         C23.12 45 22 43.88 22 42.5
         V21.5 Z"
      fill="black"
      fill-opacity="0.12"
    />
    <!-- H principal -->
    <path
      d="M22 20.5
         C22 19.12 23.12 18 24.5 18
         H27.5
         C28.88 18 30 19.12 30 20.5
         V27.5
         H34
         V20.5
         C34 19.12 35.12 18 36.5 18
         H39.5
         C40.88 18 42 19.12 42 20.5
         V41.5
         C42 42.88 40.88 44 39.5 44
         H36.5
         C35.12 44 34 42.88 34 41.5
         V34.5
         H30
         V41.5
         C30 42.88 28.88 44 27.5 44
         H24.5
         C23.12 44 22 42.88 22 41.5
         V20.5 Z"
      fill="white"
      fill-opacity="0.96"
    />
  </g>

  <!-- Punto de sanación / pulso -->
  <circle cx="32" cy="31" r="2" fill="white" fill-opacity="0.9">
    
  </circle>
</svg>
