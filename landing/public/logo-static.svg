<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Healify">
  <defs>
    <linearGradient id="bodyGrad" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="55%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="32" cy="36" r="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glassStroke" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#06b6d4" flood-opacity="0.35"/>
      <feDropShadow dx="0" dy="2" stdDeviation="8" flood-color="#10b981" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Glow central -->
  <circle cx="32" cy="36" r="28" fill="url(#glowGrad)"/>

  <!-- Escudo: protección / sanar -->
  <path d="M16 8h32a8 8 0 0 1 8 8l-.55 17.2a21.5 21.5 0 0 1-10.6 17.9L32 57.5l-12.85-6.4a21.5 21.5 0 0 1-10.6-17.9L8 16a8 8 0 0 1 8-8z"
        fill="url(#bodyGrad)" filter="url(#softGlow)"/>
  <path d="M16 8h32a8 8 0 0 1 8 8l-.55 17.2a21.5 21.5 0 0 1-10.6 17.9L32 57.5l-12.85-6.4a21.5 21.5 0 0 1-10.6-17.9L8 16a8 8 0 0 1 8-8z"
        fill="none" stroke="url(#glassStroke)" stroke-width="1.2"/>

  <!-- Highlight superior (cristal) -->
  <rect x="17" y="11.5" width="30" height="6" rx="3" fill="#ffffff" opacity="0.18"/>

  <!-- H estilizada negativa, con sombra interna -->
  <g>
    <g opacity="0.12">
      <path d="M21 20.5v26M43 20.5v26M21 31.5h22" stroke="#000000" stroke-width="5.5" stroke-linecap="round" fill="none"/>
    </g>
    <path d="M21 19v26M43 19v26M21 30h22" stroke="#ffffff" stroke-opacity="0.96" stroke-width="5.5" stroke-linecap="round" fill="none"/>
  </g>
</svg>
