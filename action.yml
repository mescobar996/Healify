# Vive en la RAÍZ del repo a propósito: GitHub Marketplace solo publica actions cuyo
# `action.yml` está en el directorio raíz. El código sigue viviendo en `gh-action/`.
name: 'Healify — Check broken selectors'
# El Marketplace rechaza descripciones de 125 caracteres o más. Esta tiene 111: si la editás,
# contá antes de pushear — el error solo aparece al intentar publicar el release, no en CI.
description: 'Finds broken test selectors and comments the fix on your PR. 100% local, no AI, no cloud. Never modifies files.'
author: 'Matías Escobar'
branding:
  icon: 'search'
  color: 'green'
inputs:
  github-token:
    description: 'GitHub token for posting PR comments. Needs `pull-requests: write` permission.'
    required: false
    default: ${{ github.token }}
  project-path:
    description: 'Directory to run Healify in (for monorepos where the test project is not at the repo root)'
    required: false
    default: '.'
  history-cache:
    description: 'Keep .healify/history.jsonl across runs so Healify can tell you which selectors keep breaking. Set to false to disable.'
    required: false
    default: 'true'
  # Los inputs de abajo habilitan el modo "auto-PR", pensado para workflow_dispatch (manual) y
  # schedule (diario): la action lee el log de tests fallidos, extrae los selectores rotos y abre
  # una PR con las correcciones aplicadas. En pull_request estos inputs no tienen efecto — el
  # flujo de comentario clásico sigue intacto.
  test-log-path:
    description: 'Path to the failed test log (relative to project-path) to analyze in workflow_dispatch/schedule runs. The workflow must run your tests and redirect output to this file.'
    required: false
    default: 'test-output.log'
  auto-pr:
    description: 'In workflow_dispatch/schedule runs, open a PR with the applied fixes. Set to false to apply fixes without opening a PR.'
    required: false
    default: 'true'
  fail-on-unsupported:
    description: 'Fail the job when Healify cannot analyze the log (missing file, no selectors found, or CLI error). Default false: logs and continues so scheduled runs do not go red for informational runs.'
    required: false
    default: 'false'
  labels:
    description: 'Comma-separated labels to apply to the auto-generated PR.'
    required: false
    default: ''
# Composite, no `node20`, y la razón importa: un action `node20` no puede restaurar un cache
# (eso es un step, no una llamada de librería) y tampoco puede depender de `@actions/cache`,
# porque `gh-action/node_modules` está gitignoreado y GitHub no instala dependencias de un
# action. Composite resuelve las dos cosas sin agregar una sola dependencia: `actions/cache`
# es un step más y `run.js` sigue corriendo con cero deps de runtime.
runs:
  using: 'composite'
  steps:
    # El cache es por rama, con fallback a la rama base — que es la semántica correcta acá:
    # una PR arranca sabiendo qué se venía rompiendo en main. La key lleva run_id para que
    # cada corrida guarde una entrada nueva en vez de pisar la anterior.
    - name: Restore Healify history
      if: inputs.history-cache != 'false'
      uses: actions/cache@v4
      with:
        path: ${{ inputs.project-path }}/.healify
        key: healify-history-${{ github.ref_name }}-${{ github.run_id }}
        restore-keys: |
          healify-history-${{ github.ref_name }}-
          healify-history-

    - name: Run Healify
      shell: bash
      run: node "$GITHUB_ACTION_PATH/gh-action/run.js"
      env:
        # En composite los inputs no llegan solos como INPUT_*: hay que mapearlos a mano.
        # run.js los lee con guion bajo, no con guion medio.
        INPUT_GITHUB_TOKEN: ${{ inputs.github-token }}
        INPUT_PROJECT_PATH: ${{ inputs.project-path }}
        INPUT_TEST_LOG_PATH: ${{ inputs.test-log-path }}
        INPUT_AUTO_PR: ${{ inputs.auto-pr }}
        INPUT_FAIL_ON_UNSUPPORTED: ${{ inputs.fail-on-unsupported }}
        INPUT_LABELS: ${{ inputs.labels }}
